name: Frontend CI

on:
  push:
    branches:
      - main
      - mdev
  pull_request:
    branches:
      - main
      - mdev

# Moindre privilège pour le jeton GitHub ; une PR relancée annule l'exécution précédente (jamais main)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  # Typage, tests et build de production
  build:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies (lockfile strict)
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧹 Lint (bloquant sur les erreurs, avertissements = dette suivie)
        run: npm run lint

      - name: 🧪 Unit tests
        run: npm test

      # Couverture mesurée d'abord (rapport) : modules de lib/ chargés par les tests (ADR 0002 du dépôt Backend)
      - name: 📊 Coverage of lib/ (report only)
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings --experimental-test-coverage --test-coverage-include='lib/**' --test "tests/**/*.test.mjs"

      - name: 🔨 Build
        run: npm run build

      - name: 🛡️ Dependency audit (report only)
        continue-on-error: true
        run: npm audit --omit=dev

  # Secrets
  security:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Empreinte SHA-256 épinglée dans le workflow (GITLEAKS_SHA256) : une archive remplacée dans la release est refusée
      - name: 🔐 Install gitleaks (SHA-256 pinned)
        run: |
          V="${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: 🔐 Secrets introduced by this push / PR (blocking)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
          else
            echo "::warning::Commit précédent introuvable (nouvelle branche ou push forcé) : scan limité au dernier commit."
            RANGE="${SHA}~1..${SHA}"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${RANGE}" .

      - name: 🔐 Full history scan (report only)
        continue-on-error: true
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .
